<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="nightmode" content="disable">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest" id="manifestLink">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png" id="touchIcon">
<meta name="supported-color-schemes" content="light">
<title>健身房预约</title>
<style>
  :root{
    --blue:#30a6f0;
    --blue-dark:#1e8fd6;
    --grey:#808080;
    --red:#ff0000;
    --bar:#f5fbff;
    --page:#f1f1f3;
    --text:#111;
    --sub:#8a8a8a;
    --radius:14px;
    /* 顶栏配色：浅色模式白底黑字，深色模式黑底白字（跟随系统） */
    --topbar-bg:#ffffff;
    --topbar-fg:#111111;
    --topbar-line:#ececec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:only light;-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;background:#f1f1f3}
  /* 让文档本身滚动：全屏 / 独立窗口 / 桌面浏览器行为都一致 */
  body{min-height:100vh;min-height:100dvh}
  body{
    background:var(--page);
    color:var(--text);
    font-family:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:block;
  }
  body.immersive{ --statusbar:29px; }   /* 全屏时系统状态栏被隐藏，黑边由页面自己补齐 */
  .phone{
    width:100%;max-width:430px;min-height:100vh;min-height:100dvh;background:#fff;
    position:relative;margin:0 auto;
    padding:0 8px;box-sizing:border-box;      /* 两侧 8px 白边，像钉钉的容器留白 */
  }

  /* ============ 顶栏 ============ */
  .topbar{
    position:sticky;top:0;z-index:20;height:58px;
    background:var(--topbar-bg);color:var(--topbar-fg);
    transition:background .2s,color .2s;
    display:flex;align-items:center;
    margin:0 -8px;
    padding:0 8px 0 11px;
    /* 全屏时系统状态栏被隐藏，用 --statusbar 补出同样的黑边高度 */
    padding-top:var(--statusbar, 29px);   /* 与钉钉真机一致：状态栏 29 + 标题栏 58 = 87 */
    box-sizing:content-box;
  }
  .topbar{justify-content:space-between}
  .topbar .left{display:flex;align-items:center}
  .topbar .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .topbar .title{
    position:absolute;left:0;right:0;top:var(--statusbar, 29px);height:58px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    font-size:16.5px;font-weight:500;letter-spacing:.5px;
  }
  .topbar .right{display:flex;align-items:center}
  .topbar .ico{width:40px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.95}
  .topbar{border-bottom:1px solid var(--topbar-line)}
  @media (prefers-color-scheme: dark){
    :root{
      --topbar-bg:#000000;
      --topbar-fg:#ffffff;
      --topbar-line:transparent;
    }
  }
  svg{display:block}

  /* ============ 横幅 ============ */
  .banner{
    display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;
    /* 真机横幅比例 1080:388，比原图略扁，用 cover 裁一点保持比例一致 */
    aspect-ratio:1028/400;object-fit:cover;object-position:center;  /* 真机：宽 1028 时高 400 */
  }

  /* ============ 标签 ============ */
  .tabs{display:flex;background:#fff;border-bottom:1px solid #f0f0f0;position:sticky;z-index:15;
    top:calc(58px + var(--statusbar, 29px))}
  .tab{
    flex:1;height:43px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#7c7c7c;position:relative;cursor:pointer;
  }
  .tab.active{color:var(--blue)}   /* 字重两个都 700，只有颜色不同 */
  .tab.active::after{
    content:"";position:absolute;bottom:0;left:5px;right:0;
    height:3px;border-radius:1px;background:var(--blue);
  }

  /* ============ 日期条 ============ */
  .dates{display:flex;gap:0;padding:9px 6px 10px;background:#fff;overflow-x:auto}
  .dates::-webkit-scrollbar{display:none}
  .day{
    flex:1;min-width:0;display:flex;justify-content:center;cursor:pointer;color:#666;
  }
  .day .box{
    width:34px;padding:4px 0;border-radius:9px;
    display:flex;flex-direction:column;align-items:center;gap:0;
    transition:background .15s;
  }
  .day .w{font-size:11px;line-height:15px;font-weight:400;color:#333}   /* 周几：常规字重、深灰 */
  .day .d{font-size:10px;line-height:14px;color:#9a9a9a}                /* 日期：浅灰、略小 */
  .day .s{font-size:9.5px;line-height:13px;color:var(--blue)}
  .day.sel .w,.day.sel .d,.day.sel .s{color:#fff}
  .day.sel .box{background:var(--blue);box-shadow:0 2px 8px rgba(48,166,240,.35)}
  .day.sel .d,.day.sel .s{color:#fff}

  /* ============ 卡片列表 ============ */
  .list{padding:21px 13px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px;background:var(--page)}
  .card{
    background:#fff;border-radius:var(--radius);padding:12px 16px 14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;
  }
  .card .head{display:flex;align-items:center;gap:11px;margin-bottom:19px}
  .dot{width:6px;height:6px;border-radius:50%;background:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.18)}
  .name{font-size:12.5px;font-weight:700;color:#000;letter-spacing:.2px;line-height:18px}
  .pill{
    margin-left:auto;margin-right:-16px;min-width:88px;height:20px;padding:0 10px;border-radius:10px 0 0 10px;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:600;color:#fff;background:var(--grey);white-space:nowrap;letter-spacing:.2px;
  }
  .pill.on{background:var(--blue)}
  .time{display:flex;align-items:center;padding:0 31px 0 17px;font-size:12px;line-height:18px;color:#111;font-weight:500}
  .time .t{width:58px;letter-spacing:.2px}
  .time .t:last-child{text-align:right}
  .arrow{flex:1;display:flex;align-items:center;padding:0 10px}
  .foot{
    margin-top:20px;background:var(--bar);border-radius:5px;height:34px;
    display:flex;align-items:center;padding:0 12px 0 35px;font-size:12.5px;
  }
  .foot .gym{width:111px;white-space:nowrap}
  .foot .rest{flex:1;white-space:nowrap}
  .btn{
    min-width:62px;height:19px;padding:0 12px;border-radius:10px;border:0;
    font-size:10px;color:#fff;background:var(--grey);font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .08s,filter .15s;
  }
  .btn:active{transform:scale(.96)}
  .btn.cancel{background:var(--red)}
  .btn:disabled{opacity:1;cursor:default}

  /* ============ 我的预约 ============ */
  .empty{
    padding:70px 0 90px;text-align:center;color:#aaa;font-size:12px;background:var(--page);
  }
  .empty .big{font-size:44px;margin-bottom:12px;opacity:.35}

  /* ============ Toast ============ */
  .toast{
    position:fixed;left:50%;bottom:12%;transform:translate(-50%,10px);
    background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:8px 15px;border-radius:18px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .hidden{display:none!important}

  /* 全屏按钮 */
  .fsbtn{
    position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;z-index:120;
    background:rgba(17,17,17,.55);color:#fff;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:.9;transition:opacity .2s,transform .1s;
  }
  .fsbtn:active{transform:scale(.94)}
  .fsbtn.fade{opacity:.25}
  @supports(padding:max(0px)){
    .phone{padding-bottom:env(safe-area-inset-bottom)}
  }
</style>
</head>

<script>
/* =========================================================
   健身房预约 · 复刻版（纯前端演示）
   数据全部存在浏览器 localStorage 里，没有任何后端请求。
   ========================================================= */

const STORE_KEY = 'gym-booking-demo-v5';   /* 改了初始数据就升版本，避免读到旧缓存 */

/* ---------- 造数据 ---------- */
/* 一周固定从周一开始：周一…周日，位置永远不变，今天只是被高亮的那一格 */
const WEEK_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];

function ymd(dt){
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function mondayOfWeek(d){
  const dow = d.getDay();                 // 0=周日, 1=周一 …
  const back = dow === 0 ? 6 : dow - 1;   // 回退到本周一
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back);
}
function buildDays(){
  const now = new Date();
  const todayKey = ymd(now);
  const monday = mondayOfWeek(now);
  const days = [];
  for (let i = 0; i < 7; i++){
    const dt = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const key = ymd(dt);
    const isToday = key === todayKey;
    const isPast = dt.getTime() < new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    days.push({
      key: key,
      week: isToday ? '今天' : WEEK_NAMES[i],   // 显示用（今天替换掉周几）
      weekday: WEEK_NAMES[i],                    // 真正的周几，固定不变
      date: String(dt.getMonth()+1).padStart(2,'0') + '.' + String(dt.getDate()).padStart(2,'0'),
      longDate: key,
      isToday: isToday,
      isPast: isPast,
      slots: isPast
        ? [
            { id:'s1', name:'场次一', start:'17:30:00', end:'18:00:00', total:2, remaining:0, booked:false },
            { id:'s2', name:'场次二', start:'18:20:00', end:'18:50:00', total:2, remaining:0, booked:false },
            { id:'s3', name:'场次三', start:'19:10:00', end:'19:40:00', total:2, remaining:0, booked:false }
          ]
        : isToday
        ? [
            { id:'s1', name:'场次一', start:'17:30:00', end:'18:00:00', total:2, remaining:0, booked:false },
            { id:'s2', name:'场次二', start:'18:20:00', end:'18:50:00', total:2, remaining:0, booked:false },
            { id:'s3', name:'场次三', start:'19:10:00', end:'19:40:00', total:2, remaining:0, booked:true }
          ]
        : [
            { id:'s1', name:'场次一', start:'17:30:00', end:'18:00:00', total:2, remaining:0, booked:false },
            { id:'s2', name:'场次二', start:'18:20:00', end:'18:50:00', total:2, remaining:0, booked:false },
            { id:'s3', name:'场次三', start:'19:10:00', end:'19:40:00', total:2, remaining:0, booked:false }
          ]
    });
  }
  return days;
}

/* ---------- 状态 ---------- */
let state = load();

function load(){
  // fresh 里的"今天/已过/周几"永远按当前时间算，缓存只用来恢复"约没约过"
  const fresh = buildDays();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.days) && s.days.length === 7 && s.days[0].key === fresh[0].key){
        s.days = fresh.map((fd, i) => {
          const old = s.days[i] || {};
          const oldSlots = Array.isArray(old.slots) ? old.slots : [];
          fd.slots = fd.slots.map((fs, j) => Object.assign({}, fs, { booked: !!(oldSlots[j] && oldSlots[j].booked) }));
          return fd;                       // 日期、周几、今天标记、是否已过：全部取新的
        });
        const idx = fresh.findIndex(d => d.isToday);
        s.dayIndex = (idx >= 0 ? idx : Math.min(s.dayIndex || 0, 6));
        return s;
      }
    }
  }catch(e){}
  const idx = fresh.findIndex(d => d.isToday);
  return { tab:'book', dayIndex: idx < 0 ? 0 : idx, days: fresh };
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- 工具 ---------- */
const $ = sel => document.querySelector(sel);
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ---------- 渲染：日期条 ---------- */
function renderDates(){
  $('#dates').innerHTML = state.days.map((d, i) => `
    <div class="day ${i === state.dayIndex ? 'sel' : ''}" data-day="${i}"><div class="box">
      <div class="w">${d.week}</div>
      <div class="d">${d.date}</div>
      <div class="s">${d.isPast ? '&nbsp;' : '可约'}</div>
    </div></div>`).join('');
}

/* ---------- 渲染：场次卡片 ---------- */
function slotStatus(slot){
  /* 剩余恒为 0，但按钮依然可点：只有已预约 / 未预约两态 */
  if (slot.booked) return { top:'已预约', topClass:'on', btn:'取消预约', btnClass:'cancel', disabled:false };
  return { top:'未预约', topClass:'', btn:'预约', btnClass:'', disabled:false };
}

function renderSlots(){
  const day = state.days[state.dayIndex];
  $('#slots').innerHTML = day.slots.map((slot, idx) => {
    const st = slotStatus(slot);
    const rest = slot.booked ? slot.remaining : slot.remaining;
    return `
    <div class="card">
      <div class="head">
        <span class="dot"></span>
        <span class="name">${slot.name}</span>
        <span class="pill ${st.topClass}">${st.top}</span>
      </div>
      <div class="time">
        <span class="t">${slot.start}</span>
        <span class="arrow">
          <svg width="100%" height="14" viewBox="0 0 200 14" preserveAspectRatio="none">
            <path d="M2 6 H172 V3 L200 8 H2 Z" fill="#30a6f0"/>
          </svg>
        </span>
        <span class="t">${slot.end}</span>
      </div>
      <div class="foot">
        <span class="gym">健身房</span>
        <span class="rest">剩余：${slot.remaining}</span>
        <button class="btn ${st.btnClass}" data-act="${slot.booked ? 'cancel' : 'book'}"
                data-idx="${idx}" ${st.disabled ? 'disabled' : ''}>${st.btn}</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- 渲染：我的预约 ---------- */
function renderMine(){
  const rows = [];
  state.days.forEach(d => {
    d.slots.forEach((slot, idx) => {
      if (slot.booked) rows.push({ d, slot, idx });
    });
  });
  rows.sort((a,b) => (a.d.key + a.slot.start).localeCompare(b.d.key + b.slot.start));

  if (!rows.length){
    $('#mineList').innerHTML = `<div class="empty"><div class="big">🏋️</div>还没有预约记录</div>`;
    return;
  }
  $('#mineList').innerHTML = rows.map(r => `
    <div class="card">
      <div class="head">
        <span class="dot"></span>
        <span class="name">${r.slot.name}(${r.d.longDate})</span>
        <span class="pill on">未扫码</span>
      </div>
      <div class="time">
        <span class="t">${r.slot.start}</span>
        <span class="arrow">
          <svg width="100%" height="14" viewBox="0 0 200 14" preserveAspectRatio="none">
            <path d="M2 6 H172 V3 L200 8 H2 Z" fill="#30a6f0"/>
          </svg>
        </span>
        <span class="t">${r.slot.end}</span>
      </div>
      <div class="foot">
        <span class="gym">健身房</span>
        <span class="rest">剩余：${r.slot.remaining}</span>
        <button class="btn cancel" data-mine="${r.d.key}|${r.idx}">取消预约</button>
      </div>
    </div>`).join('');
}

/* ---------- 渲染总入口 ---------- */
function render(){
  renderDates();
  renderSlots();
  renderMine();
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === state.tab);
  });
  $('#dates').classList.toggle('hidden', state.tab !== 'book');
  $('#slots').classList.toggle('hidden', state.tab !== 'book');
  $('#mine').classList.toggle('hidden', state.tab !== 'mine');
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  // 切换标签
  const tab = e.target.closest('.tab');
  if (tab){ state.tab = tab.dataset.tab; save(); render(); return; }

  // 切换日期
  const day = e.target.closest('.day');
  if (day){ state.dayIndex = +day.dataset.day; save(); render(); return; }

  // 预约 / 取消（场次页）
  const act = e.target.closest('[data-act]');
  if (act){
    const slot = state.days[state.dayIndex].slots[+act.dataset.idx];
    if (act.dataset.act === 'book'){
      slot.booked = true;
      toast('预约成功');
    }else{
      slot.booked = false;
      toast('已取消预约');
    }
    save(); render(); return;
  }

  // 取消（我的预约页）
  const mi = e.target.closest('[data-mine]');
  if (mi){
    const [key, idx] = mi.dataset.mine.split('|');
    const d = state.days.find(x => x.key === key);
    if (d){
      const slot = d.slots[+idx];
      slot.booked = false;
      toast('已取消预约');
      save(); render();
    }
    return;
  }

  // 返回按钮
  if (e.target.closest('.back')) history.length > 1 ? history.back() : toast('已经是第一页了');
});

/* ---------- 本地 file:// 打开时去掉外部资源引用（避免 404 / 空白） ---------- */
if (location.protocol === 'file:'){
  ['manifestLink','touchIcon'].forEach(function(id){
    var el = document.getElementById(id); if (el) el.removeAttribute('href');
  });
}

/* ---------- 沉浸态（黑边高度对齐） ---------- */
function syncImmersive(){
  const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle('immersive', fs || isStandalone());
}
document.addEventListener('fullscreenchange', syncImmersive);
document.addEventListener('webkitfullscreenchange', syncImmersive);
window.addEventListener('resize', syncImmersive);

/* ---------- 全屏 ---------- */
const fsBtn = document.getElementById('fsBtn');
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
const canFullscreen = () => document.fullscreenEnabled
        || document.webkitFullscreenEnabled
        || document.documentElement.webkitRequestFullscreen;

function syncFsBtn(){
  // 已经是独立窗口（添加到桌面打开的）就不需要这个按钮
  fsBtn.classList.toggle('hidden', isStandalone() || !canFullscreen());
  fsBtn.classList.toggle('fade', !!(document.fullscreenElement || document.webkitFullscreenElement));
}
fsBtn.addEventListener('click', async () => {
  const el = document.documentElement;
  const active = document.fullscreenElement || document.webkitFullscreenElement;
  try{
    if (active){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }else{
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI:'hide' });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else return toast('当前浏览器不支持全屏');
    }
  }catch(err){
    toast('这个浏览器不允许网页全屏');
  }
  setTimeout(syncFsBtn, 300);
});
document.addEventListener('fullscreenchange', syncFsBtn);
document.addEventListener('webkitfullscreenchange', syncFsBtn);
syncFsBtn();
syncImmersive();

render();
</script>
</body>
